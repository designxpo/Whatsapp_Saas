# Nightly content pipeline — research, draft, review, and open a PR.
#
# It does NOT publish. Merging the PR publishes. That is deliberate: Google's
# scaled content abuse policy targets exactly the pattern of generating pages
# on a schedule with no human judgement in the loop, and thetalko.in is a young
# domain with few backlinks — the profile with the least margin for a manual
# action. A two-minute review removes that entire category of risk, and every
# stage before the PR is still fully automatic.
#
# Setup (repo → Settings → Secrets and variables → Actions):
#   secret  GEMINI_API_KEY        — required by default; drafting + fact-check
#   variable CONTENT_AI_PROVIDER  — optional: gemini (default) | openai | anthropic
#   variable CONTENT_MODEL        — optional; defaults to that provider's model
#   secret  CONTENT_AI_KEY        — optional; use a SEPARATE key for drafting
#                                   instead of the provider's usual variable
#   secret  CRON_SECRET           — optional; lets the run file its report to
#                                   Owner Console → Content (same value as the app's)
#
# Drafting goes through the app's own runChat (src/lib/ai/chat.ts), the same
# path every production AI reply takes, so the pipeline cannot drift away from
# how the rest of the system talks to a model — and switching provider is a
# variable, not a rewrite.
#
# NOTE: a GitHub Actions secret is a different store from your Vercel env. The
# key value can be identical; it still has to be added in both places.
#
# Runs at 20:40 UTC (02:10 IST). Deliberately NOT on the hour: GitHub queues
# every :00 schedule on the planet at once, and this job is in no hurry.

name: content-pipeline

on:
  schedule:
    - cron: "40 20 * * 1-5"    # weeknights only — a PR nobody reads on Sunday is noise
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Research only — list the gaps, write nothing"
        type: boolean
        default: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # the crawl is deliberately slow and polite
    permissions:
      contents: write          # push the content branch
      pull-requests: write     # open the PR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }

      - run: npm ci

      # The pipeline is TypeScript run natively by node --experimental-strip-types,
      # so it is typechecked like the rest of the repo rather than being a pile
      # of untyped glue. Fail here rather than halfway through a crawl.
      - name: Typecheck the pipeline
        run: npx tsc -p scripts --noEmit

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_AI_KEY: ${{ secrets.CONTENT_AI_KEY }}
          CONTENT_AI_PROVIDER: ${{ vars.CONTENT_AI_PROVIDER }}
          CONTENT_MODEL: ${{ vars.CONTENT_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Files the gap report back to the Owner Console → Content page.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONTENT_REPORT_URL: ${{ vars.CRON_URL && 'https://app.thetalko.in' || '' }}
        run: |
          # A dry run is research only and needs no model at all, so the key
          # check is skipped for it — that is the run you want first anyway.
          if [ "${{ inputs.dry_run }}" != "true" ] \
             && [ -z "$CONTENT_AI_KEY" ] && [ -z "$GEMINI_API_KEY" ] \
             && [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No model key. Add GEMINI_API_KEY (Settings → Secrets and variables → Actions), or set CONTENT_AI_PROVIDER to one you have a key for."
            exit 1
          fi
          git config user.name  "talko-content-bot"
          git config user.email "noreply@thetalko.in"
          node --experimental-strip-types scripts/content-pipeline/run.ts \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # The gap list is useful even when drafting fails — it is the research
      # half, and it is what tells you whether the topic selection is sane.
      - name: Upload research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-gaps
          path: tmp/content-pipeline/
          if-no-files-found: ignore
