<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Talko Copilot</title>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="20" height="20" />
      <span>Talko Copilot</span>
    </div>
    <div id="themeSlot" class="themeslot"></div>
  </header>

  <main>
    <button id="status" class="statusrow" type="button" title="Connection status">Checking…</button>

    <!-- Page actions: both fill the form below, so they sit above it. -->
    <div class="actions" id="actions">
      <button id="grab" class="action" type="button">
        <span class="aicon" aria-hidden="true">⇱</span>
        <span class="atext">
          <strong>Grab selection</strong>
          <small>Read the text you highlighted</small>
        </span>
      </button>
      <button id="scan" class="action" type="button">
        <span class="aicon" aria-hidden="true">⌕</span>
        <span class="atext">
          <strong>Scan page</strong>
          <small>Find every contact on this page</small>
        </span>
      </button>
    </div>

    <form id="lead" autocomplete="off">
      <label class="field">
        <span>Name</span>
        <input id="name" type="text" placeholder="Lead's name" />
      </label>

      <label class="field">
        <span>Phone <em>required</em></span>
        <input id="phone" type="tel" inputmode="tel" placeholder="e.g. +91 98765 43210" required />
      </label>

      <label class="field">
        <span>Email <em>optional</em></span>
        <input id="email" type="email" placeholder="name@company.com" />
      </label>

      <label class="field">
        <span>Tags</span>
        <input id="tags" type="text" placeholder="comma, separated" />
        <small class="hint" id="tagHint"></small>
      </label>

      <label class="check">
        <input id="consent" type="checkbox" />
        <span>This lead agreed to be contacted on WhatsApp</span>
      </label>

      <p class="source" id="source" hidden></p>

      <button id="submit" class="primary" type="submit">Add to Talko</button>
      <p id="result" class="result" role="status" aria-live="polite" hidden></p>
    </form>

    <section class="quick" id="quick" hidden>
      <h2>Quick actions</h2>
      <div class="quickrow">
        <button id="openWa" class="ghost" type="button">Open WhatsApp chat</button>
        <button id="copyWa" class="ghost" type="button">Copy chat link</button>
      </div>
      <details>
        <summary>Show QR code</summary>
        <div class="qrwrap">
          <img id="qr" alt="WhatsApp chat QR code" width="180" height="180" />
          <small class="hint">Right-click → Save image to print it.</small>
        </div>
      </details>
    </section>

    <!-- Scan results — replaces the form, so the popup never becomes a long scroll.
         Every row is proposed only: nothing is saved until it's ticked and added. -->
    <section id="scanPanel" class="scan" hidden>
      <div class="scanhead">
        <button id="scanBack" class="backbtn" type="button">← Back</button>
        <strong id="scanCount" class="scancount"></strong>
      </div>
      <p id="scanNote" class="hint"></p>

      <ul id="scanList" class="scanlist"></ul>

      <label class="check">
        <input id="scanConsent" type="checkbox" />
        <span>These people agreed to be contacted on WhatsApp</span>
      </label>

      <div class="scanfoot">
        <button id="scanToggleAll" class="ghost" type="button">Select all</button>
        <button id="scanImport" class="primary" type="button" disabled>Add to Talko</button>
      </div>
      <p id="scanMsg" class="result" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <footer class="foot">
    <button id="inbox" class="footbtn" type="button"><span aria-hidden="true">☰</span> Inbox</button>
    <button id="opts" class="footbtn" type="button"><span aria-hidden="true">⚙</span> Settings</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
