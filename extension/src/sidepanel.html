<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="sidepanel.css" />
  <title>Talko Inbox</title>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="20" height="20" />
      <span class="brandname">Talko</span>
      <span id="ws" class="ws"></span>
    </div>
    <button id="refresh" class="icon" type="button" title="Refresh" aria-label="Refresh">↻</button>
  </header>

  <main>
    <!-- Not connected -->
    <section id="connect" class="empty-state" hidden>
      <img src="../icons/icon128.png" alt="" width="56" height="56" />
      <h2>Connect your workspace</h2>
      <p>Add your API key to see your chats and reply from here.</p>
      <button id="openOpts" class="primary" type="button">Open settings</button>
    </section>

    <!-- Conversation list -->
    <section id="listView">
      <nav class="channels" id="channels" aria-label="Filter by channel"></nav>
      <div class="subbar">
        <button id="filter" class="toggle" type="button" aria-pressed="false">
          <span class="tick" aria-hidden="true">✓</span> Needs reply only
        </button>
        <span id="listCount" class="count"></span>
      </div>
      <ul id="list" class="list"></ul>
      <div id="listState" class="empty-state small" hidden></div>
    </section>

    <!-- One thread -->
    <section id="threadView" hidden>
      <div class="threadhead">
        <button id="back" class="icon" type="button" title="Back to inbox" aria-label="Back to inbox">←</button>
        <div class="who">
          <strong id="tName"></strong>
          <span class="whosub">
            <span id="tChannel" class="chan"></span>
            <span id="tPhone" class="mono"></span>
          </span>
        </div>
      </div>

      <div id="tStatus" class="statusbar">
        <span id="tStatusLabel" class="statuslabel"></span>
        <span id="tStatusHint" class="statushint"></span>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="composer">
        <div id="templateRow" class="templaterow" hidden>
          <label class="flabel" for="tplName">Approved template</label>
          <select id="tplName" class="mono"><option value="">Choose a template…</option></select>
          <input id="tplParams" placeholder="Values, comma-separated" hidden />
          <small id="tplHint" class="fhint" hidden></small>
        </div>

        <div id="textRow" class="textrow">
          <textarea id="draft" rows="3" placeholder="Write a reply…"></textarea>
        </div>

        <div class="composerbtns">
          <button id="suggest" class="ghost" type="button" title="Draft a reply with AI">
            <span aria-hidden="true">✦</span> Draft with AI
          </button>
          <button id="send" class="primary" type="button">Send</button>
        </div>
        <p id="composerMsg" class="cmsg" role="status" aria-live="polite" hidden></p>
      </div>
    </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
