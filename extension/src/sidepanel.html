<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="sidepanel.css" />
  <title>Talko Inbox</title>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="20" height="20" />
      <span class="brandname">Talko</span>
      <span id="ws" class="ws"></span>
    </div>
    <div class="baractions">
      <a id="openPortal" class="icon" href="#" target="_blank" rel="noreferrer" title="Open the portal">↗</a>
      <button id="refresh" class="icon" type="button" title="Refresh" aria-label="Refresh">↻</button>
    </div>
  </header>

  <main>
    <!-- Not connected -->
    <section id="connect" class="empty-state" hidden>
      <img src="../icons/icon128.png" alt="" width="56" height="56" />
      <h2>Connect your workspace</h2>
      <p>Add your API key to see your chats and reply from here.</p>
      <button id="openOpts" class="primary" type="button">Open settings</button>
    </section>

    <!-- Inbox -->
    <section id="listView">
      <div class="filters">
        <!-- Chats vs comments, as in the portal — plus the whole contact book -->
        <div class="views" role="tablist" aria-label="Chats, comments or contacts">
          <button id="viewChats" class="viewtab" type="button" role="tab" aria-selected="true">Chats <span class="n" id="nChats"></span></button>
          <button id="viewComments" class="viewtab" type="button" role="tab" aria-selected="false">Comments <span class="n" id="nComments"></span></button>
          <button id="viewContacts" class="viewtab" type="button" role="tab" aria-selected="false">Contacts</button>
        </div>

        <input id="search" class="search" type="search" placeholder="Search name or number" autocomplete="off" />

        <nav class="channels" id="channels" role="tablist" aria-label="Filter by channel"></nav>
        <div class="statuses" id="statuses" role="group" aria-label="Filter by status"></div>
      </div>

      <ul id="list" class="list"></ul>
      <div id="listState" class="empty-state small" hidden></div>
    </section>

    <!-- One thread -->
    <section id="threadView" hidden>
      <div class="threadhead">
        <button id="back" class="icon" type="button" title="Back to inbox" aria-label="Back to inbox">←</button>
        <div class="who">
          <strong id="tName"></strong>
          <span class="whosub">
            <span id="tChannel" class="chan"></span>
            <span id="tPhone" class="mono"></span>
            <span id="tEscalated" class="tag escalated" hidden>Escalated</span>
          </span>
        </div>
      </div>

      <!-- Thread controls, mirroring the portal's Live Chat actions -->
      <div class="threadtools">
        <button id="botToggle" class="tool" type="button"></button>
        <button id="escalate" class="tool" type="button"></button>
        <a id="openThreadPortal" class="tool" href="#" target="_blank" rel="noreferrer">Open in portal ↗</a>
      </div>

      <!-- Who am I talking to: history, value and pipeline position -->
      <details id="ctxCard" class="ctx">
        <summary>
          <span id="ctxLine" class="ctxline">Loading contact…</span>
          <span class="ctxmore" aria-hidden="true">Details</span>
        </summary>
        <div class="ctxbody">
          <p id="ctxOrders" class="ctxrow"></p>
          <p id="ctxLast" class="ctxrow"></p>

          <div class="ctxfield">
            <label class="flabel" for="ctxStage">Pipeline stage</label>
            <select id="ctxStage"><option value="">Not in the pipeline</option></select>
          </div>

          <div class="ctxfield">
            <span class="flabel">Tags</span>
            <div id="ctxTags" class="taglist"></div>
            <div class="tagadd">
              <input id="ctxTagInput" placeholder="Add a tag" autocomplete="off" />
              <button id="ctxTagAdd" class="tool" type="button">Add</button>
            </div>
          </div>

          <div class="ctxfield">
            <label class="flabel" for="ctxNote">Private note</label>
            <textarea id="ctxNote" rows="2" placeholder="Only your team sees this"></textarea>
            <button id="ctxNoteSave" class="tool" type="button">Save note</button>
          </div>
          <p id="ctxMsg" class="fhint" role="status" aria-live="polite" hidden></p>
        </div>
      </details>

      <div id="tStatus" class="statusbar">
        <span id="tStatusLabel" class="statuslabel"></span>
        <span id="tStatusHint" class="statushint"></span>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="composer" id="composer">
        <div id="templateRow" class="fieldrow" hidden>
          <label class="flabel" for="tplName">Approved template</label>
          <select id="tplName" class="mono"><option value="">Choose a template…</option></select>
          <input id="tplParams" placeholder="Values, comma-separated" hidden />
          <small id="tplHint" class="fhint" hidden></small>
        </div>

        <!-- Sell in the chat: find a product, send it, take payment -->
        <details id="sellCard" class="sell">
          <summary>
            <span>Send a product or payment link</span>
            <span id="cartLine" class="cartline"></span>
          </summary>
          <div class="sellbody">
            <!-- Product dropdown: thumbnail + title, since a native select can't show images -->
            <div class="picker">
              <button id="prodTrigger" class="pickertrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span id="prodThumbSlot" class="thumbslot" hidden></span>
                <span id="prodTriggerLabel" class="pickerlabel">Choose a product</span>
                <span id="prodTriggerPrice" class="pickerprice"></span>
                <span class="pickercaret" aria-hidden="true">▾</span>
              </button>
              <div id="prodMenu" class="pickermenu" hidden>
                <input id="prodSearch" class="search" type="search" placeholder="Search your catalog" autocomplete="off" />
                <ul id="prodList" class="prodlist" role="listbox" aria-label="Products"></ul>
              </div>
            </div>

            <div class="sellbtns">
              <button id="sendProduct" class="tool" type="button" disabled>Send product</button>
              <button id="addToCart" class="tool" type="button" disabled>+ Cart</button>
            </div>
            <p id="sellMsg" class="fhint" role="status" aria-live="polite" hidden></p>
            <div class="sellbtns">
              <button id="sendPayLink" class="tool" type="button">Send payment link</button>
              <button id="clearCart" class="tool" type="button">Clear cart</button>
            </div>
          </div>
        </details>

        <div id="textRow" class="fieldrow">
          <div id="quickRow" class="quickrow" hidden></div>
          <textarea id="draft" rows="3" placeholder="Write a reply…"></textarea>
        </div>

        <div class="composerbtns">
          <button id="suggest" class="ghost" type="button" title="Draft a reply with AI">
            <span aria-hidden="true">✦</span> Draft with AI
          </button>
          <button id="send" class="primary" type="button">Send</button>
        </div>
        <p id="composerMsg" class="cmsg" role="status" aria-live="polite" hidden></p>
      </div>
    </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
